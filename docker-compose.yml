services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/hospital
      SECRET_KEY: change-this-long-random-string
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
